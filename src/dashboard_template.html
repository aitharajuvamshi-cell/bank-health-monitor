<style>
/* Layout: a supervisor's binder. Sticky tab strip of sections, each section a stack of
   evidence panels; every panel cites the FDIC field codes it was computed from. */
:root {
  --bg: #f4f6f8; --surface: #fcfcfd; --raise: #ffffff;
  --ink: #0b0d12; --ink2: #4b515b; --muted: #80868f;
  --grid: #e3e6ea; --axis: #c3c7cd; --ring: rgba(11,13,18,.10);
  --accent: #1c5cab; --accent-wash: #e6eefa;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c0e12; --surface: #15181d; --raise: #1b1f25;
  --ink: #eef0f3; --ink2: #c0c4cc; --muted: #8a9099;
  --grid: #272b31; --axis: #3a3f46; --ring: rgba(255,255,255,.10);
  --accent: #6da7ec; --accent-wash: #1a2a40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c0e12; --surface: #15181d; --raise: #1b1f25;
  --ink: #eef0f3; --ink2: #c0c4cc; --muted: #8a9099;
  --grid: #272b31; --axis: #3a3f46; --ring: rgba(255,255,255,.10);
  --accent: #6da7ec; --accent-wash: #1a2a40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 18px; }
.eyebrow { font: 500 12px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 clamp(28px, 4vw, 40px)/1.1 var(--f-display); margin: 8px 0 10px; text-wrap: balance; letter-spacing: -.01em; }
h2 { font: 600 22px/1.25 var(--f-display); margin: 0 0 6px; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--f-display); margin: 0 0 4px; }
.lede { color: var(--ink2); max-width: 70ch; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font: 13px var(--f-mono); color: var(--muted); }
.meta b { color: var(--ink2); font-weight: 500; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--grid); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { font: 500 14px var(--f-body); color: var(--ink2); background: none; border: 0; padding: 12px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 22px 60px; }
section.tab { display: grid; gap: 18px; }
.intro { display: grid; gap: 6px; max-width: 78ch; }
.intro p { margin: 0; color: var(--ink2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 18px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.panel p { margin: 0; color: var(--ink2); }
.q { font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.src { font: 12px/1.4 var(--f-mono); color: var(--muted); }
.src code { color: var(--ink2); }
.answer { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; color: var(--ink) !important; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; display: grid; gap: 4px; align-content: start; }
.kpi .lbl { font-size: 13px; color: var(--ink2); }
.kpi .val { font: 600 32px/1.1 var(--f-display); letter-spacing: -.01em; }
.kpi .sub { font-size: 13px; color: var(--muted); }

.findings { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.findings li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.findings li .qn { font: 500 12px/22px var(--f-mono); color: var(--accent); }
.findings a { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg text { font: 11px var(--f-mono); fill: var(--muted); }
.chart svg .dl { font: 500 11px var(--f-body); fill: var(--ink2); }
.tip { position: absolute; pointer-events: none; background: var(--raise); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 140px; z-index: 3; }
.tip .t { font: 500 11px var(--f-mono); color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .r i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
.tip .r b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.legend i.box { height: 10px; width: 10px; border-radius: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px var(--f-body); border: 1px solid var(--ring); background: var(--raise); color: var(--ink2); padding: 4px 10px 4px 8px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; display: inline-block; }
.chip[aria-pressed="true"] { color: var(--ink); background: var(--accent-wash); border-color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
label.ctl { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); }
select, input[type="search"] { font: 14px var(--f-body); color: var(--ink); background: var(--raise); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 8px; max-width: 100%; }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
tr.hl td { background: var(--accent-wash); }
td.pos { color: var(--ink); font-weight: 600; }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details[open] summary { margin-bottom: 8px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 12px var(--f-body); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ring); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.note { font-size: 13px; color: var(--ink2); background: var(--accent-wash); border-radius: 8px; padding: 10px 12px; }
.small-multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.sm { display: grid; gap: 2px; min-width: 0; }
.sm h4 { margin: 0; font: 500 13px var(--f-body); color: var(--ink2); }
ul.plain { margin: 0; padding-left: 18px; color: var(--ink2); display: grid; gap: 6px; }
footer { color: var(--muted); font-size: 12px; padding-block: 0 40px; }
@media (prefers-reduced-motion: no-preference) { .chart path.ln { transition: opacity .15s; } }
</style>

<header class="top"><div class="wrap">
  <div class="eyebrow">FDIC Call Report analysis</div>

</div></header>

<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tablist"></div></nav>

</main>

<script>
const D = /*__DATA__*/null;
const A = D.a, M = D.m, DQ = D.dq, EX = D.ex;

/* ---------------------------------------------------------------- helpers */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v);
  }
  for (const k of [].concat(kids)) if (k != null) e.append(k);
  return e;
};
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nf = (v, d = 0) => v == null || Number.isNaN(v) ? "n/a" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? "n/a" : nf(v, d) + "%";
const bn = (v, d = 0) => v == null ? "n/a" : "$" + nf(v, d) + "bn";
const ordn = v => { v = Math.round(v); const t = v % 100 >= 10 && v % 100 <= 20 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[v % 10] || "th"); return v + t; };
const signed = (v, d = 1) => v == null ? "n/a" : (v > 0 ? "+" : "") + nf(v, d) + "%";

function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { hi = lo + 1; }
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const t0 = Math.floor(lo / step) * step, t1 = Math.ceil(hi / step) * step, out = [];
  for (let t = t0; t <= t1 + step / 2; t += step) out.push(+t.toFixed(10));
  return out;
}
const renderers = [];
function register(fn) { renderers.push(fn); fn(); }
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => renderers.forEach(f => f()), 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderers.forEach(f => f()));
new MutationObserver(() => renderers.forEach(f => f())).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function tipBox(host) {
  let t = host.querySelector(":scope > .tip");
  if (!t) { t = el("div", { class: "tip", hidden: "" }); host.append(t); }
  return t;
}
function fillTip(t, title, rows) {
  t.replaceChildren(el("div", { class: "t", text: title }));
  for (const r of rows) {
    const key = el("i"); key.style.background = r.color || css("--muted");
    t.append(el("div", { class: "r" }, [key, el("b", { text: r.value }), el("span", { text: r.name })]));
  }
}
function placeTip(t, host, x, y) {
  t.hidden = false;
  const w = t.offsetWidth, hw = host.clientWidth;
  let left = x + 14; if (left + w > hw) left = Math.max(0, x - w - 14);
  t.style.left = left + "px"; t.style.top = Math.max(0, y - 10) + "px";
}

/* ---------------------------------------------------------------- line chart
   One y-axis only. Nulls break the line. Crosshair snaps to nearest x. */
function lineChart(host, o) {
  const H = o.height || 260;
  const draw = () => {
    host.querySelectorAll("svg, .legend").forEach(n => n.remove());
    const W = Math.max(280, host.clientWidth);
    const direct = o.series.length <= 4 && W > 520 && !o.noDirect;
    const m = { l: 48, r: direct ? 118 : 14, t: 12, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.x.length;
    const all = o.series.flatMap(s => s.values).filter(v => v != null);
    (o.refLines || []).forEach(r => all.push(r.y));
    let lo = Math.min(...all), hi = Math.max(...all);
    if (o.zero !== false && lo > 0) lo = 0;
    const ticks = niceTicks(lo, hi, o.ticks || 5); lo = ticks[0]; hi = ticks[ticks.length - 1];
    const X = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
    const Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.label || "" });
    (o.bands || []).forEach(b => {
      const i0 = o.x.indexOf(b.from), i1 = o.x.indexOf(b.to);
      if (i0 < 0 || i1 < 0) return;
      svg.append(sv("rect", { x: X(i0), y: m.t, width: X(i1) - X(i0), height: ih, fill: css("--accent-wash") }));
      const t = sv("text", { x: X(i0) + 6, y: m.t + 14 }); t.textContent = b.label; svg.append(t);
    });
    ticks.forEach(t => {
      svg.append(sv("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: t === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }));
      const tx = sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = (o.tickFmt || o.fmt)(t); svg.append(tx);
    });
    const every = Math.max(1, Math.ceil(n / (iw / 62)));
    o.x.forEach((lab, i) => {
      const yr = lab.slice(0, 4), isQ1 = !lab.includes("Q") || lab.endsWith("Q1");
      const step = Math.max(1, Math.round(every / 4));
      if (isQ1 && (+yr) % step === 0) {
        const tx = sv("text", { x: X(i), y: H - 6, "text-anchor": "middle" }); tx.textContent = lab.includes("Q") ? yr : lab; svg.append(tx);
      }
    });
    (o.refLines || []).forEach(r => {
      svg.append(sv("line", { x1: m.l, x2: m.l + iw, y1: Y(r.y), y2: Y(r.y), stroke: css("--muted"), "stroke-dasharray": "4 4" }));
      const tx = sv("text", { x: m.l + 4, y: Y(r.y) - 5 }); tx.textContent = r.label; svg.append(tx);
    });
    const ends = [];
    o.series.forEach(s => {
      let d = "", pen = false;
      s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); pen = true; });
      svg.append(sv("path", { d, fill: "none", stroke: css(s.color), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", class: "ln" }));
      let li = s.values.length - 1; while (li >= 0 && s.values[li] == null) li--;
      if (li >= 0) {
        svg.append(sv("circle", { cx: X(li), cy: Y(s.values[li]), r: 3.5, fill: css(s.color), stroke: css("--surface"), "stroke-width": 2 }));
        ends.push({ y: Y(s.values[li]), x: X(li), s, v: s.values[li] });
      }
    });
    if (direct) {
      ends.sort((a, b) => a.y - b.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
      ends.forEach(e => { const tx = sv("text", { x: m.l + iw + 8, y: e.y + 4, class: "dl" }); tx.textContent = e.s.name; svg.append(tx); });
    }
    const cross = sv("line", { y1: m.t, y2: m.t + ih, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" });
    svg.append(cross);
    const dots = o.series.map(s => { const c = sv("circle", { r: 4, fill: css(s.color), stroke: css("--surface"), "stroke-width": 2, visibility: "hidden" }); svg.append(c); return c; });
    const hit = sv("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent", tabindex: 0 });
    svg.append(hit);
    const tip = tipBox(host);
    let cur = n - 1;
    const show = (i, px, py) => {
      cur = Math.max(0, Math.min(n - 1, i));
      cross.setAttribute("x1", X(cur)); cross.setAttribute("x2", X(cur)); cross.setAttribute("visibility", "visible");
      const rows = [];
      o.series.forEach((s, k) => {
        const v = s.values[cur];
        if (v == null) { dots[k].setAttribute("visibility", "hidden"); return; }
        dots[k].setAttribute("cx", X(cur)); dots[k].setAttribute("cy", Y(v)); dots[k].setAttribute("visibility", "visible");
        rows.push({ value: o.fmt(v), name: s.name, color: css(s.color), v });
      });
      rows.sort((a, b) => b.v - a.v);

      placeTip(tip, host, px != null ? px : X(cur) * sc, py != null ? py : m.t * sc);
    };
    const hide = () => { cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); tip.hidden = true; };
    hit.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), sc = r.width / W;
      const x = (e.clientX - r.left) / sc;
      show(Math.round((x - m.l) / (iw / Math.max(1, n - 1))), e.clientX - r.left, e.clientY - r.top);
    });
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("blur", hide);
    hit.addEventListener("focus", () => show(cur));
    hit.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { show(cur - 1); e.preventDefault(); } if (e.key === "ArrowRight") { show(cur + 1); e.preventDefault(); } });
    if (o.series.length >= 2) {
      const lg = el("div", { class: "legend" });
      o.series.forEach(s => { const i = el("i"); i.style.background = css(s.color); lg.append(el("span", {}, [i, document.createTextNode(s.name)])); });
      host.prepend(lg);

    host.prepend(svg); if (o.series.length >= 2) host.prepend(host.querySelector(".legend"));
  };
  register(draw);
  if (o.table !== false) host.after(tableDetails(o.x, o.series.map(s => ({ name: s.name, values: s.values })), o.fmt));
}

function tableDetails(x, cols, fmt) {
  const d = el("details"); d.append(el("summary", { text: "Show the numbers as a table" }));
  const t = el("table"), hr = el("tr");
  hr.append(el("th", { text: "Period" })); cols.forEach(c => hr.append(el("th", { text: c.name })));
  t.append(el("thead", {}, hr));
  const tb = el("tbody");
  for (let i = x.length - 1; i >= 0; i--) {
    const tr = el("tr"); tr.append(el("td", { text: x[i] }));
    cols.forEach(c => tr.append(el("td", { text: c.values[i] == null ? "" : fmt(c.values[i]) })));
    tb.append(tr);
  }
  t.append(tb); d.append(el("div", { class: "tbl" }, t));
  return d;
}

/* ---------------------------------------------------------------- vertical bars */
function barChart(host, o) {
  const H = o.height || 220;
  const draw = () => {
    host.querySelectorAll("svg").forEach(n => n.remove());
    const W = Math.max(260, host.clientWidth), m = { l: 44, r: 10, t: 12, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.x.length;
    const hi0 = Math.max(...o.values.filter(v => v != null), 0);
    const ticks = niceTicks(0, hi0 || 1, 4), hi = ticks[ticks.length - 1];
    const bw = iw / n, gap = Math.min(6, Math.max(2, bw * .25));
    const Y = v => m.t + ih - v / hi * ih;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.label || "" });
    ticks.forEach(t => {
      svg.append(sv("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: t === 0 ? css("--axis") : css("--grid") }));
      const tx = sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = (o.tickFmt || o.fmt)(t); svg.append(tx);
    });
    const tip = tipBox(host);
    const every = Math.ceil(n / (iw / 40));
    o.x.forEach((lab, i) => {
      const v = o.values[i] || 0, x = m.l + i * bw + gap / 2, w = Math.max(1, bw - gap), y = Y(v), base = Y(0);
      const rr = Math.min(4, w / 2, base - y);
      const color = css(o.colorFor ? o.colorFor(lab, i) : (o.color || "--s1"));
      if (v > 0) svg.append(sv("path", { d: `M${x},${base}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + w - rr}Q${x + w},${y} ${x + w},${y + rr}V${base}Z`, fill: color }));
      if (i % every === 0 || i === n - 1) { const tx = sv("text", { x: x + w / 2, y: H - 6, "text-anchor": "middle" }); tx.textContent = o.xFmt ? o.xFmt(lab) : lab; svg.append(tx); }
      const hit = sv("rect", { x: m.l + i * bw, y: m.t, width: bw, height: ih, fill: "transparent", tabindex: 0 });
      const on = (px, py) => { fillTip(tip, String(lab), [{ value: o.fmt(o.values[i]), name: o.name || "", color }].concat(o.extra ? o.extra(i) : [])); placeTip(tip, host, px, py); };
      hit.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect(); on(e.clientX - r.left, e.clientY - r.top); });
      hit.addEventListener("focus", () => { const r = svg.getBoundingClientRect(); on((x + w) * r.width / W, y * r.width / W); });
      hit.addEventListener("pointerleave", () => tip.hidden = true); hit.addEventListener("blur", () => tip.hidden = true);

  };

}

/* ---------------------------------------------------------------- horizontal bars */
function hbar(host, o) {
  const draw = () => {
    host.querySelectorAll("svg").forEach(n => n.remove());
    const rows = o.rows, W = Math.max(280, host.clientWidth);
    const lw = Math.min(o.labelWidth || 170, W * .42), rowH = 28, m = { t: o.ref ? 20 : 6, b: 6, r: 64 };
    const H = m.t + rows.length * rowH + m.b, iw = W - lw - m.r;
    const vals = rows.map(r => r.value).concat(o.ref ? [o.ref.value] : []);
    const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    const X = v => lw + (v - lo) / ((hi - lo) || 1) * iw;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.label || "" });
    const tip = tipBox(host);
    svg.append(sv("line", { x1: X(0), x2: X(0), y1: m.t - 4, y2: H - m.b, stroke: css("--axis") }));
    rows.forEach((r, i) => {
      const y = m.t + i * rowH + 5, h = rowH - 10, x0 = X(Math.min(0, r.value)), x1 = X(Math.max(0, r.value));
      const color = css(r.color || o.color || "--s1"), w = Math.max(1, x1 - x0), rr = Math.min(4, w / 2);
      const d = r.value >= 0
        ? `M${x0},${y}H${x1 - rr}Q${x1},${y} ${x1},${y + rr}V${y + h - rr}Q${x1},${y + h} ${x1 - rr},${y + h}H${x0}Z`
        : `M${x1},${y}H${x0 + rr}Q${x0},${y} ${x0},${y + rr}V${y + h - rr}Q${x0},${y + h} ${x0 + rr},${y + h}H${x1}Z`;
      svg.append(sv("path", { d, fill: color }));
      const lab = sv("text", { x: lw - 8, y: y + h / 2 + 4, "text-anchor": "end", class: "dl" }); lab.textContent = r.label; svg.append(lab);
      const vt = sv("text", { x: r.value >= 0 ? x1 + 6 : x0 - 6, y: y + h / 2 + 4, "text-anchor": r.value >= 0 ? "start" : "end" }); vt.textContent = o.fmt(r.value); svg.append(vt);
      const hit = sv("rect", { x: 0, y: y - 5, width: W, height: rowH, fill: "transparent", tabindex: 0 });
      const on = (px, py) => { fillTip(tip, r.label, [{ value: o.fmt(r.value), name: o.name || "", color }].concat(r.extra || [])); placeTip(tip, host, px, py); };
      hit.addEventListener("pointermove", e => { const b = svg.getBoundingClientRect(); on(e.clientX - b.left, e.clientY - b.top); });
      hit.addEventListener("focus", () => on(x1 * host.clientWidth / W, y));
      hit.addEventListener("pointerleave", () => tip.hidden = true); hit.addEventListener("blur", () => tip.hidden = true);
      svg.append(hit);
    });
    if (o.ref) {
      svg.append(sv("line", { x1: X(o.ref.value), x2: X(o.ref.value), y1: m.t - 4, y2: H - m.b, stroke: css("--ink2"), "stroke-dasharray": "3 3" }));
      const t = sv("text", { x: X(o.ref.value), y: 11, "text-anchor": "middle" }); t.textContent = o.ref.label; svg.append(t);
    }
    host.prepend(svg);
  };
  register(draw);
}

/* ---------------------------------------------------------------- scatter */
function scatter(host, o) {
  const H = o.height || 360;
  const draw = () => {
    host.querySelectorAll("svg").forEach(n => n.remove());
    const W = Math.max(280, host.clientWidth), m = { l: 48, r: 16, t: 28, b: 40 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xs = o.points.map(p => p.x), ys = o.points.map(p => p.y);
    const xt = niceTicks(Math.min(0, ...xs), Math.max(...xs), 5), yt = niceTicks(Math.min(0, ...ys), Math.max(...ys), 5);
    const X = v => m.l + (v - xt[0]) / (xt[xt.length - 1] - xt[0]) * iw;
    const Y = v => m.t + ih - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * ih;
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": o.label || "" });
    yt.forEach(t => { svg.append(sv("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: t === 0 ? css("--axis") : css("--grid") }));
      const tx = sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }); tx.textContent = o.fmtY(t); svg.append(tx); });
    xt.forEach(t => { const tx = sv("text", { x: X(t), y: m.t + ih + 16, "text-anchor": "middle" }); tx.textContent = o.fmtX(t); svg.append(tx); });
    const xl = sv("text", { x: m.l + iw, y: H - 4, "text-anchor": "end" }); xl.textContent = o.xLabel; svg.append(xl);
    const yl = sv("text", { x: m.l - 40, y: 11 }); yl.textContent = o.yLabel; svg.append(yl);
    (o.refX != null) && svg.append(sv("line", { x1: X(o.refX), x2: X(o.refX), y1: m.t, y2: m.t + ih, stroke: css("--muted"), "stroke-dasharray": "4 4" }));
    (o.refY != null) && svg.append(sv("line", { x1: m.l, x2: m.l + iw, y1: Y(o.refY), y2: Y(o.refY), stroke: css("--muted"), "stroke-dasharray": "4 4" }));
    const tip = tipBox(host);
    const sorted = [...o.points].sort((a, b) => (a.hl ? 1 : 0) - (b.hl ? 1 : 0));
    sorted.forEach(p => {
      const c = css(p.hl ? "--s2" : (p.label ? "--s3" : "--s1"));
      svg.append(sv("circle", { cx: X(p.x), cy: Y(p.y), r: p.hl || p.label ? 6 : 4, fill: c, "fill-opacity": p.hl || p.label ? 1 : .55, stroke: css("--surface"), "stroke-width": 2 }));
      if (p.label) { const right = X(p.x) > W - 150; const t = sv("text", { x: X(p.x) + (right ? 0 : 9), y: Y(p.y) + (right ? -11 : 4), class: "dl", "text-anchor": right ? "end" : "start" }); t.textContent = p.label; svg.append(t); }
      const hit = sv("circle", { cx: X(p.x), cy: Y(p.y), r: 12, fill: "transparent", tabindex: p.label ? 0 : -1 });
      const on = (px, py) => { fillTip(tip, p.label || (p.hl ? "Failed 2023" : "Bank, $10bn+ assets"), [{ value: o.fmtX(p.x), name: o.xLabel, color: c }, { value: o.fmtY(p.y), name: o.yLabel, color: c }]); placeTip(tip, host, px, py); };
      hit.addEventListener("pointermove", e => { const b = svg.getBoundingClientRect(); on(e.clientX - b.left, e.clientY - b.top); });
      hit.addEventListener("focus", () => on(X(p.x) * host.clientWidth / W, Y(p.y)));
      hit.addEventListener("pointerleave", () => tip.hidden = true); hit.addEventListener("blur", () => tip.hidden = true);
      svg.append(hit);
    });
    host.prepend(svg);
  };
  register(draw);
}

      "02_clean.py builds one bank-quarter panel, logs every cleaning rule with a row count, and derives 20 ratios.",
      "03_analysis.py answers questions 1-5, 9 and 10.",
      "04_early_warning.py trains and backtests the screens (6, 7, 8).",
      "05_build_dashboard.py writes this page from the JSON results.",
      "06_claude_memo.py drafts a quarterly memo from aggregate numbers only. Row-level data never leaves the machine.",
    ].map(t => el("li", { text: t })))]),
    panel(null, "Data quality log", [table([{ key: 0, label: "Step" }, { key: 1, label: "Count" }], rows)]),
  ]));
  s.append(panel(null, "Limits", [el("ul", { class: "plain" }, [
    "Call Reports are filed per bank charter. JPMorgan Chase Bank, N.A. is not JPMorgan Chase & Co.; holding-company figures differ.",
    "Year-to-date ratios (ROA, NIM, charge-off rate) are annualized by the FDIC; the Q1 value covers one quarter, the Q4 value the full year.",
    "Public filings miss what examiners see: management quality, CAMELS ratings, enforcement letters, intra-quarter deposit flight.",
    "Failure is rare after 2012 (" + SP.test_failed_banks + " banks in the test era), so model hit rates carry real uncertainty.",
    "The 2023 funding screen was built after the outcome was known. It illustrates a blind spot; it is not evidence of foresight.",
    "FDIC loss estimates for recent failures are still provisional, and some failures carry $0.",
  ].map(t => el("li", { text: t })))]));
};

$("#foot").textContent = `Built from FDIC BankFind Suite public data. Figures regenerate from the pipeline; none are typed by hand. Not investment advice and not a statement about the safety of any bank.`;
showTab();
</script>
